# ─── Workestra Platform ───
# Portainer Stack - docker-compose.yml
# Self-hosted corporate platform

version: "3.8"

# ── Networks ──
networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge

# ── Volumes ──
volumes:
  postgres_data:
  minio_data:
  opensearch_data:
  zeebe_data:
  redis_data:

services:
  # ═══════════════════════════════════════════
  # 1. PostgreSQL - Main Database
  # ═══════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: workestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workestra_secret}
      POSTGRES_DB: ${POSTGRES_DB:-workestra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workestra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════
  # 2. Redis - Queue & Cache
  # ═══════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: workestra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════
  # 3. OpenSearch - Search & Indexing
  # ═══════════════════════════════════════════
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: workestra-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════
  # 4. MinIO - Object Storage
  # ═══════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: workestra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workestra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════
  # 5. Apache Tika - Content Extraction
  # ═══════════════════════════════════════════
  tika:
    image: apache/tika:2.9.2
    container_name: workestra-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9998/tika || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════
  # 6. Keycloak - Identity & SSO
  # ═══════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: workestra-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-workestra}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-workestra_secret}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # 7. Zeebe - Workflow Engine (Camunda 8)
  # ═══════════════════════════════════════════
  zeebe:
    image: camunda/zeebe:8.5.2
    container_name: workestra-zeebe
    restart: unless-stopped
    environment:
      - ZEEBE_BROKER_GATEWAY_SECURITY_AUTHENTICATION_MODE=none
      - ZEEBE_BROKER_EXPORTERS_OPENSEARCH_CLASSNAME=io.camunda.zeebe.exporter.opensearch.OpensearchExporter
      - ZEEBE_BROKER_EXPORTERS_OPENSEARCH_ARGS_URL=http://opensearch:9200
      - ZEEBE_BROKER_EXPORTERS_OPENSEARCH_ARGS_INDEX_PREFIX=zeebe-record
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    ports:
      - "26500:26500"
      - "9600:9600"
    networks:
      - app
      - data
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════
  # 8. Operate - Process Monitoring (Camunda 8)
  # ═══════════════════════════════════════════
  operate:
    image: camunda/operate:8.5.2
    container_name: workestra-operate
    restart: unless-stopped
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_OPENSEARCH_URL=http://opensearch:9200
      - CAMUNDA_OPERATE_ZEEBEOPSEARCH_URL=http://opensearch:9200
      - CAMUNDA_OPERATE_OPENSEARCH_INDEXPREFIX=operate
      - CAMUNDA_OPERATE_ZEEBEOPSEARCH_PREFIX=zeebe-record
      - SERVER_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - app
      - data
    depends_on:
      zeebe:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # 9. Tasklist - Task Management (Camunda 8)
  # ═══════════════════════════════════════════
  tasklist:
    image: camunda/tasklist:8.5.2
    container_name: workestra-tasklist
    restart: unless-stopped
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_OPENSEARCH_URL=http://opensearch:9200
      - CAMUNDA_TASKLIST_ZEEBEOPSEARCH_URL=http://opensearch:9200
      - CAMUNDA_TASKLIST_OPENSEARCH_INDEXPREFIX=tasklist
      - CAMUNDA_TASKLIST_ZEEBEOPSEARCH_PREFIX=zeebe-record
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - app
      - data
    depends_on:
      zeebe:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # 10. Platform API
  # ═══════════════════════════════════════════
  platform-api:
    build:
      context: ../../
      dockerfile: apps/platform-api/Dockerfile
    container_name: workestra-platform-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-workestra}:${POSTGRES_PASSWORD:-workestra_secret}@postgres:5432/${POSTGRES_DB:-workestra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-workestra}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workestra-portal}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-workestra}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
      MINIO_BUCKET: ${MINIO_BUCKET:-workestra-documents}
      OPENSEARCH_URL: http://opensearch:9200
      TIKA_URL: http://tika:9998
      ZEEBE_ADDRESS: zeebe:26500
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started

  # ═══════════════════════════════════════════
  # 11. Platform Worker
  # ═══════════════════════════════════════════
  platform-worker:
    build:
      context: ../../
      dockerfile: apps/platform-worker/Dockerfile
    container_name: workestra-platform-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-workestra}:${POSTGRES_PASSWORD:-workestra_secret}@postgres:5432/${POSTGRES_DB:-workestra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-workestra}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
      OPENSEARCH_URL: http://opensearch:9200
      TIKA_URL: http://tika:9998
      ZEEBE_ADDRESS: zeebe:26500
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # 12. Portal Web
  # ═══════════════════════════════════════════
  portal-web:
    build:
      context: ../../
      dockerfile: apps/portal-web/Dockerfile
    container_name: workestra-portal-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-workestra}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workestra-portal}
    ports:
      - "3000:3000"
    networks:
      - app
      - edge
    depends_on:
      - platform-api

  # ═══════════════════════════════════════════
  # 13. Traefik - Reverse Proxy
  # ═══════════════════════════════════════════
  proxy:
    image: traefik:v3.0
    container_name: workestra-proxy
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
      - app
    depends_on:
      - portal-web
      - platform-api
